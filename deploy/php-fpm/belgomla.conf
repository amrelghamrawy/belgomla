; PHP-FPM pool for BelGomla (installed as /etc/php/8.5/fpm/pool.d/belgomla.conf by provision.sh).
; Runs as the app user so it can write storage/; nginx (www-data) talks to it over the socket.
[belgomla]
user = belgomla
group = belgomla
listen = /run/php/belgomla.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 2 vCPU / 4 GB VM (D44): ~60 MB per worker leaves room for PostgreSQL, Redis and Next.js.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

request_terminate_timeout = 65s
catch_workers_output = yes
php_admin_value[error_log] = /var/log/php8.5-fpm-belgomla.log
php_admin_flag[log_errors] = on
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 5M
php_admin_value[memory_limit] = 256M
php_admin_value[expose_php] = off
