# Wildcard certificate for gomalecommerce.app + *.gomalecommerce.app (Tech §7), issued by provision.sh with
# certbot's DNS challenge; certbot's timer renews it and reloads nginx (deploy hook).
ssl_certificate /etc/letsencrypt/live/gomalecommerce.app/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/gomalecommerce.app/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:belgomla_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;
