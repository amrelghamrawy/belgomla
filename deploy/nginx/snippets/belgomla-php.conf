# Every PHP request goes to Laravel's front controller. fastcgi_params passes SERVER_NAME and friends, and nginx
# forwards the request headers as HTTP_*: HTTP_HOST is the browser's Host, which is all Laravel uses to
# resolve the tenant (Tech §2). HTTPS=on because the public connection is TLS, also on the internal :8081
# hop, so URLs and secure cookies behave as for the browser.
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /srv/belgomla/backend/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /srv/belgomla/backend/public;
fastcgi_param HTTPS on;
fastcgi_param HTTP_PROXY ""; # httpoxy

fastcgi_pass belgomla_php;
fastcgi_read_timeout 60s;
fastcgi_buffer_size 32k;
fastcgi_buffers 16 16k;
