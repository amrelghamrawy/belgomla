# gzip is always on. Brotli needs the libnginx-mod-http-brotli-* packages; provision.sh installs them when the
# distribution has them and then enables the block below by symlinking belgomla-brotli.conf.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

include snippets/belgomla-brotli.conf*;
