# Next.js (belgomla-next.service, `next start` on :3000). Host and the original scheme are kept so the
# server-side prefetch rebuilds the shopper's origin (lib/server/store-data.ts reads x-forwarded-proto).
proxy_pass http://belgomla_next;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $belgomla_connection_upgrade;
proxy_read_timeout 60s;
proxy_buffers 16 16k;
proxy_buffer_size 32k;
