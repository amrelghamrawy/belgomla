# BelGomla production vhosts (tasks/11-release.md). Installed as /etc/nginx/sites-available/belgomla.conf
# by provision.sh, with the snippets in /etc/nginx/snippets/. Paths assume the checkout in /srv/belgomla.
#
# Routing rules that must hold (Tech §5, rules/03 §4, D61):
#   - Laravel resolves the tenant from Host only. Every hop to PHP keeps the browser's Host:
#     fastcgi passes the request's Host header as HTTP_HOST.
#   - /up, /api/, /sanctum/ go to PHP-FPM and /storage/ is served from disk BEFORE `location /` sends the
#     rest to Next.js. Next's own app/api, app/sanctum and app/storage route handlers are the dev proxy and
#     must never be reached here.
#   - hooks.gomalecommerce.app reaches Laravel only (Hypersender webhooks, 08-api-contract §13).
#   - 127.0.0.1:8081 is the internal listener for Next's server-side listing prefetch
#     (lib/server/store-data.ts, BACKEND_HOST/BACKEND_PORT), still with the shopper's Host.

upstream belgomla_php {
    server unix:/run/php/belgomla.sock;
}

upstream belgomla_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

map $http_upgrade $belgomla_connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS for everything. TLS is issued with the DNS challenge, so no ACME location is needed.
server {
    listen 80;
    listen [::]:80;
    server_name gomalecommerce.app *.gomalecommerce.app;

    return 301 https://$host$request_uri;
}

# Tenant hosts: storefront, account, dashboard, API (Tech §5).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.gomalecommerce.app;

    include snippets/belgomla-tls.conf;
    include snippets/belgomla-headers.conf;
    include snippets/belgomla-compression.conf;

    root /srv/belgomla/backend/public;
    client_max_body_size 4m; # product images and logos (tasks/11)

    access_log /var/log/nginx/belgomla.access.log;
    error_log /var/log/nginx/belgomla.error.log warn;

    location = /up {
        include snippets/belgomla-php.conf;
        access_log off;
    }

    location ^~ /api/ {
        include snippets/belgomla-php.conf;
    }

    location ^~ /sanctum/ {
        include snippets/belgomla-php.conf;
    }

    # D61: uploads on the public disk, same origin. `expires` (not add_header) keeps the security headers.
    location ^~ /storage/ {
        alias /srv/belgomla/backend/storage/app/public/;
        expires 30d;
        access_log off;
        location ~ \.(php|phtml)$ { return 404; }
    }

    location / {
        include snippets/belgomla-next.conf;
    }
}

# Webhooks host: Laravel only, never Next (08-api-contract §13).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hooks.gomalecommerce.app;

    include snippets/belgomla-tls.conf;
    include snippets/belgomla-headers.conf;

    root /srv/belgomla/backend/public;
    client_max_body_size 1m;

    access_log /var/log/nginx/belgomla-hooks.access.log;
    error_log /var/log/nginx/belgomla-hooks.error.log warn;

    location / {
        include snippets/belgomla-php.conf;
    }
}

# The apex has no site in V1 (no platform UI, Tech §5).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gomalecommerce.app;

    include snippets/belgomla-tls.conf;

    return 404;
}

# Internal: Next.js server-side prefetch -> Laravel. Loopback only; the browser connection was HTTPS.
server {
    listen 127.0.0.1:8081;
    server_name _;

    root /srv/belgomla/backend/public;
    access_log off;

    location ^~ /api/ {
        include snippets/belgomla-php.conf;
    }

    location ^~ /sanctum/ {
        include snippets/belgomla-php.conf;
    }

    location ^~ /storage/ {
        alias /srv/belgomla/backend/storage/app/public/;
    }

    location / {
        return 404;
    }
}
